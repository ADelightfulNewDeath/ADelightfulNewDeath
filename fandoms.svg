<svg xmlns="http://www.w3.org/2000/svg" width="900" height="465" viewBox="0 0 900 465">

  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#565A55"></stop>
      <stop offset="48%" stop-color="#F5F7E9"></stop>
      <stop offset="100%" stop-color="#848484"></stop>
    </linearGradient>
  </defs>

<text x="450" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="url(#g)">𓏲𝄢 𝑭𝒂𝒏𝒅𝒐𝒎𝒔 𑣲𝄞</text>
  <text x="450" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-style="italic" fill="#565A55">𑣲⋆ 𝑭𝒐𝒓 𝑹𝑶𝑩𝑳𝑶𝑿 :</text>
  <text x="450" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-style="italic" fill="#F5F7E9">𑣲⋆ 𝑵𝒖𝒍𝒍𝒔𝒄𝒂𝒑𝒆, 𝑵𝒐 𝑴𝒐𝒓𝒆 𝑻𝒊𝒎𝒆, 𝑻𝑹𝑶𝑹, 𝑩𝒂𝒅 𝑻𝒉𝒊𝒏𝒈𝒔, 𝑴.𝑬.𝑮, 𝑹𝒆𝒈𝒓𝒆𝒕𝒆𝒗𝒂𝒕𝒐𝒓, 𝑩𝒍𝒐𝒄𝒌 𝑻𝒂𝒍𝒆𝒔,...</text>
  <text x="450" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-style="italic" fill="#565A55">𑣲⋆ 𝑯𝑼𝑮𝑬 𝑺𝒑𝒐𝒌𝒆𝑰𝒔𝑯𝒆𝒓𝒆 𝒇𝒂𝒏, 𝑰 𝒂𝒍𝒔𝒐 𝒍𝒐𝒗𝒆 𝑨𝑹𝑮𝒔 𝒏 𝑺𝑴𝑷𝒔.</text>
  <text x="450" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-style="italic" fill="#F5F7E9">𑣲⋆ 𝑵𝒐𝒕 𝒓𝒆𝒂𝒍𝒍𝒚 𝒂 𝒇𝒂𝒏 𝒐𝒇 𝒂𝒏𝒊𝒎𝒆, 𝒔𝒐𝒓𝒓𝒚.</text>

  <text x="450" y="295" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="url(#g)">₊˚ ✧ ━━━━⊱⋆⊰━━━━ ✧ ₊˚</text>

  <text x="450" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-style="italic" fill="#565A55">𑣲⋆ 𝑰'𝒎 𝒎𝒐𝒓𝒆 𝒕𝒂𝒍𝒌𝒂𝒕𝒊𝒗𝒆 𝒘𝒉𝒆𝒏 𝒊𝒕 𝒄𝒐𝒎𝒆𝒔 𝒕𝒐 𝒇𝒂𝒗 𝒈𝒂𝒎𝒆𝒔.</text>
  <text x="450" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-style="italic" fill="#F5F7E9">𑣲⋆ 𝑰 𝒂𝒍𝒔𝒐 𝒑𝒍𝒂𝒚 𝑺𝒌𝒚 𝑪𝒐𝒕𝒍, 𝑳𝒆𝒂𝒈𝒖𝒆 𝒏 𝑶𝒔𝒖 .ᐟ.ᐟ</text>
  <text x="450" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-style="italic" fill="#565A55">𑣲⋆ 𝑻𝒚 𝒇𝒐𝒓 𝒓𝒆𝒂𝒅𝒊𝒏𝒈. ♡</text>

</svg>
