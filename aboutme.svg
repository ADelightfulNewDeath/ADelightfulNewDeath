<text x="450" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-style="italic" fill="#FF9BCB">✮ 𝗜'𝗠 𝗩𝟯𝗥𝗬 𝗖𝟬𝗠𝗙𝟬𝗥𝗧 𝟰𝗡𝗗 𝗙𝟯𝟯𝗟 𝗡𝟭𝗖𝟯 𝗜𝗙 𝗬𝟬𝗨 𝗧𝗥𝗬𝟭𝗡𝗚 𝗧𝟬 𝗖𝟬𝗡𝗧𝟰𝗖𝗧, 𝗦𝟬 𝗗𝟬𝗡'𝗧 𝗦𝗛𝗬 ^_^</text>

<text x="450" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-style="italic" fill="#8FE3FF">✮ 𝗜’𝗠 𝗡𝟬𝗧 𝗧𝗛𝟯 𝗧𝗬𝗣𝟯 𝗧𝟬 𝗜𝗡𝗜𝗧𝟭𝟰𝗧𝟯 𝗖𝟬𝗡𝗩𝟯𝗥𝗦𝟰𝗧𝟭𝟬𝗡𝗦, 𝗛𝟬𝗣𝟯 𝗨 𝗖𝟬𝗨𝗟𝗗 𝗧𝟰𝗞𝟯 𝗧𝗛𝟯 𝗟𝟯𝟰𝗗</text>

<text x="450" y="172" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-style="italic" fill="#FFE7B0">✮ 𝟬𝗙𝗧𝟯𝗡 𝟰𝗙𝗞 𝗙𝟬𝗥 𝗪𝟬𝗥𝗞, 𝗦𝟬 𝗣𝗟𝟯𝟰𝗦𝟯 𝗪𝗛𝟭𝗦𝗣𝟯𝗥 𝗜𝗙 𝗜'𝗠 𝗡𝟬𝗧 𝗛𝟯𝗥𝟯 𝟬_𝗼</text>

<text x="450" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-style="italic" fill="url(#g)">✮ 𝗙𝟰𝗡𝗗𝟬𝗠𝗦 : 𝗙𝗢𝗥𝗦𝗔𝗞𝗘𝗡, 𝗥𝗘𝗚𝗥𝗘𝗧𝗘𝗩𝗔𝗧𝗢𝗥, 𝗠.𝗘.𝗚, .....𝗲𝘁𝗰</text>

<text x="450" y="244" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-style="italic" fill="#FFE7B0">(𝑎𝑟𝑡𝑤𝑜𝑟𝑘𝑠 𝑎𝑛𝑑 𝑔𝑖𝑓 ℎ𝑒𝑟𝑒 𝑎𝑟𝑒 𝑛𝑜𝑡 𝑚𝑖𝑛𝑒 — 𝑖𝑚 𝑗𝑢𝑠𝑡 𝑒𝑑𝑖𝑡𝑒𝑑 𝑡ℎ𝑒𝑚</text>

<text x="450" y="267" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-style="italic" fill="#FFE7B0">𝑎𝑙𝑠𝑜 𝑓𝑟𝑜𝑚 𝑡𝑖𝑘𝑡𝑜𝑘 𝑎𝑛𝑑 𝑝𝑖𝑛)</text>

